name: Build All Binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build'
        required: true
        type: choice
        options:
          # TAGS_START
          - v1.2.1
          - v1.2
          - v1.1.3
          - v1.1.2
          - v1.1.1
          - v1.1
          - v1.0
          - v1.0-beta7.2
          - v1.0-beta7.1
          - v1.0-beta7
          - v1.0-beta6
          - Compromise-0.9.2
          - Compromise-0.9.1
          - Compromise-0.9
          - Compromise-0.8
          - Compromise-0.7.1
          - Compromise-0.7
          - Compromise-0.6
          - Compromise-0.5
          - Compromise-0.4
          - Compromise-0.3
          - Compromise-0.2
          # TAGS_END

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-22.04
            script: ./src/subbuild-unix-unix.sh
            artifact_name: scyther-linux
            artifact_path: gui/Scyther/scyther-linux
            dependencies: cmake build-essential flex bison gcc-multilib python3-minimal
          - target: win32
            os: ubuntu-22.04
            script: ./src/subbuild-unix-w32.sh
            artifact_name: scyther-win32.exe
            artifact_path: gui/Scyther/scyther-w32.exe
            dependencies: cmake build-essential flex bison gcc-multilib python3-minimal mingw-w64 gcc-mingw-w64-i686 g++-mingw-w64-i686
          - target: macos-intel
            os: macos-15
            script: ./src/subbuild-mac-intel.sh
            artifact_name: scyther-mac-intel
            artifact_path: gui/Scyther/scyther-mac
            dependencies: cmake flex bison
          - target: macos-arm
            os: macos-15-arm64
            script: ./src/subbuild-mac-arm.sh
            artifact_name: scyther-mac-arm
            artifact_path: gui/Scyther/scyther-mac
            dependencies: cmake flex bison

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: cascremers/scyther
          ref: ${{ inputs.tag }}

      - name: Install Dependencies
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y ${{ matrix.dependencies }}
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install cmake flex bison || true
            echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH
            echo "$(brew --prefix flex)/bin" >> $GITHUB_PATH
          fi
        shell: bash

      - name: Build
        run: |
          chmod +x ${{ matrix.script }}
          ${{ matrix.script }}
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}-${{ inputs.tag }}
          path: ${{ matrix.artifact_path }}
          retention-days: 7
