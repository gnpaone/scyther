name: Build and Commit Binaries

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-24.04
            script: ./src/subbuild-unix-unix.sh
            generated_bin: scyther-linux
            final_bin: scyther-linux
            dependencies: cmake build-essential flex bison gcc-multilib python3-minimal
          - target: win32
            os: ubuntu-24.04
            script: ./src/subbuild-unix-w32.sh
            generated_bin: scyther-w32.exe
            final_bin: scyther-w32.exe
            dependencies: cmake build-essential flex bison gcc-multilib python3-minimal mingw-w64 gcc-mingw-w64-i686 g++-mingw-w64-i686
          - target: macos-intel
            os: macos-15
            script: ./src/subbuild-mac-intel.sh
            generated_bin: scyther-mac
            final_bin: scyther-mac-intel
            dependencies: cmake flex bison
          # - target: macos-arm
          #   os: macos-15
          #   script: ./src/subbuild-mac-arm.sh
          #   generated_bin: scyther-mac
          #   final_bin: scyther-mac-arm
          #   dependencies: cmake flex bison

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Dependencies
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y ${{ matrix.dependencies }}
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install cmake flex bison || true
            echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH
            echo "$(brew --prefix flex)/bin" >> $GITHUB_PATH
          fi
        shell: bash

      - name: Build
        run: |
          mkdir -p gui/Scyther
          cd src
          chmod +x $(basename ${{ matrix.script }})
          ./$(basename ${{ matrix.script }})
        shell: bash

      - name: Rename and Commit
        run: |
          TARGET_FILE="gui/Scyther/${{ matrix.final_bin }}"
          
          if [ "${{ matrix.generated_bin }}" != "${{ matrix.final_bin }}" ]; then
            mv "gui/Scyther/${{ matrix.generated_bin }}" "$TARGET_FILE"
          fi
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "$TARGET_FILE"
          
          if git diff --quiet --staged; then
            echo "No changes to ${{ matrix.final_bin }}"
            exit 0
          fi
          
          git commit -m "chore: update compiled binaries ${{ matrix.final_bin }}"
          
          MAX_RETRIES=10
          COUNT=0
          SUCCESS=false
          
          while [ $COUNT -lt $MAX_RETRIES ]; do
            git pull --rebase origin master
            if git push origin master; then
              SUCCESS=true
              break
            fi
            echo "Push failed, retrying in random seconds..."
            COUNT=$((COUNT+1))
            sleep $(( ( RANDOM % 10 )  + 1 ))
          done
          
          if [ "$SUCCESS" = "false" ]; then
            echo "Failed to push ${{ matrix.final_bin }} after $MAX_RETRIES attempts"
            exit 1
          fi
          
          echo "Successfully pushed ${{ matrix.final_bin }}"
        shell: bash
